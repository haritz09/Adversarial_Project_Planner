[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: calls a real provider and needs credentials (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "output", "vault"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
